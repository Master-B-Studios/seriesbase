<!DOCTYPE html>
<html>
    <head>
    <title>MB Movie-Creator</title>
    <meta charset="utf-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"></meta>
    <link rel="icon" type="image/x-icon" href="../homepage/images/MB_Icon_02.svg"></link>
    <style>
      body {width: 100vw;height: 100vh;display: grid;grid-template-columns: min-content auto;grid-template-rows: 100vh;background-color: #000000;margin: 0;padding: 0;overflow: hidden;color: #dbdbdb;font-size: 1rem;font-family: Arial, Helvetica, sans-serif;-webkit-tap-highlight-color: transparent;}
      body {background: radial-gradient(circle at 80% 10%,#111111, transparent 40%), radial-gradient(circle at 30% 90%, #111111, transparent 30%), linear-gradient(50deg,#000000,#111111 55%,#000000);}

      .sidebar {grid-column: 1;grid-row: 1;display: grid;grid-template-columns: min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content;border-right: 0.01rem solid #999999;overflow-y: auto;}
      .sidebar {background: radial-gradient(circle at 80% 10%,#111111, transparent 40%), radial-gradient(circle at 30% 90%, #111111, transparent 30%), linear-gradient(50deg,#000000,#111111 55%,#000000);}
      .sidebar a {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;}
      .sidebar a svg {margin: 0 0.5rem 0 0;}
      .sidebarSpacer {height: 3rem;}
      .sidebarToggle {display: none;}
      .sidebarButton {background: linear-gradient(125deg, #222222, #444444);border-radius: 1rem;border: 0.01rem solid #444444;outline: none;text-decoration: none;color: #999999;white-space: pre;cursor: pointer;transition: all 0.6s;}
      .sidebarButton:hover, .sidebarButton:active, .sidebarButton:focus {background: linear-gradient(125deg, #132b13, #081a04);border-color: #0f9b03;color: #dbdbdb;}
      .sidebarButtonActive {background: linear-gradient(125deg, #111111, #222222);border-radius: 1rem;border: 0.01rem solid #00bb66;text-decoration: none;color: #00bb66;white-space: pre;cursor: default;transition: all 0.6s;}
      .sidebarButtonNoClick {background: linear-gradient(125deg, #222222, #444444);border-radius: 1rem;border: 0.01rem solid #444444;text-decoration: none;color: #999999;white-space: pre;cursor: default;transition: all 0.6s;}
      .sidebarDiv {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;}
      .sidebarDiv svg {margin: 0 0.5rem 0 0;}

      .main {grid-column: 2;grid-row: 1;position: relative;display: grid;grid-template-columns: min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content;grid-template-rows: min-content min-content min-content;overflow-y: auto;overflow-x: hidden;}

      .inputTitleLabel {grid-column: 1;grid-row: 1;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputTitle {grid-column: 2 / span 9;grid-row: 1;min-height: 1.2rem;margin: 1rem 0.5rem;padding: 0.9rem 1rem 0.9rem 1rem;display: block;}
      .inputPosterContainer {grid-column: 11;grid-row: 1 / span 3;height: 40rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: left;color: #999999;}
      .inputPosterContainer canvas {height: 100%;aspect-ratio: 2 / 3;border-radius: 1rem;}
      .posterUploadOverlay {height: calc(50% - 1rem);aspect-ratio: 2 / 1.5;position: relative;left: -33.6%;top: -25%;display: flex;align-items: center;justify-content: center;font-size: 1rem;color: #dbdbdb00;cursor: pointer;}
      .posterUploadOverlay:hover {background: linear-gradient(125deg, #132b13bb, #081a04bb);border-radius: 1rem;border: 0.1rem solid #999999;color: #dbdbdb;}
      .posterUploadOverlay svg {margin: 0 0.5rem 0 0;}
      .posterDownloadOverlay {height: calc(50% - 1rem);aspect-ratio: 2 / 1.5;position: relative;left: -66.3%;top: 25%;display: flex;align-items: center;justify-content: center;font-size: 1rem;color: #dbdbdb00;cursor: pointer;}
      .posterDownloadOverlay:hover {background: linear-gradient(125deg, #132b13bb, #081a04bb);border-radius: 1rem;border: 0.1rem solid #999999;color: #dbdbdb;}
      .posterDownloadOverlay svg {margin: 0 0.5rem 0 0;}

      .inputNumberLabel {grid-column: 1;grid-row: 2;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputNumber {grid-column: 2;grid-row: 2;min-height: 1.2rem;min-width: 1rem;margin: 1rem 0.5rem;padding: 0.9rem 1rem 0.9rem 1rem;display: block;}
      .inputYearLabel {grid-column: 3;grid-row: 2;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputYear {grid-column: 4;grid-row: 2;min-height: 1.2rem;min-width: 1rem;margin: 1rem 0.5rem;padding: 0.9rem 1rem 0.9rem 1rem;display: block;}
      .inputFSKLabel {grid-column: 5;grid-row: 2;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputFSKContainer {grid-column: 6;grid-row: 2;height: 3rem;margin: 1rem 0.5rem;display: flex;align-items: center;justify-content: end;}
      .inputFSKContainer img {width: 2.5rem;height: 2.5rem;} .inputFSKContainer svg {width: 2rem;height: 2rem;cursor: pointer;}
      .inputRuntimeLabel {grid-column: 7;grid-row: 2;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputRuntimeHour {grid-column: 8;grid-row: 2;min-height: 1.2rem;min-width: 1rem;margin: 1rem 0.25rem 1rem 0.5rem;padding: 0.9rem;display: block;}
      .inputRuntimeDivider {grid-column: 9;grid-row: 2;height: 3rem;margin: 1rem 0 0 0;display: flex;align-items: center;justify-content: center;color: #999999;}
      .inputRuntimeMinute {grid-column: 10;grid-row: 2;min-height: 1.2rem;min-width: 1rem;margin: 1rem 0.5rem 1rem 0.25rem;padding: 0.9rem;display: block;}

      .inputPlotLabel {grid-column: 1;grid-row: 3;height: 3rem;margin: 1rem 0 0 1rem;display: flex;align-items: center;justify-content: end;color: #999999;}
      .inputPlot {grid-column: 2 / span 9;grid-row: 3;min-height: 28rem;margin: 1rem 0.5rem;padding: 0.9rem 1rem 0.9rem 1rem;display: block;}
      
      input[type="text"] {cursor: text;}
      input[accept=".jpg,.png,.webp"] {display: none;z-index: 100;cursor: pointer;}
      input[accept=".nfo"] {display: none;z-index: 100;cursor: pointer;}
    </style>
  </head>

<div style="display: none;">
  <img id="templateBG" src="index_moviecreator_template.jpg">
  <div id="loadedContent"></div>

<script>
  const sidebar = document.getElementById('sidebar');

  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const button = document.getElementById("sidebarToggle");
    const isOpen = sidebar.classList.toggle("open");
    button.setAttribute("aria-expanded", isOpen);
    button.setAttribute("aria-label", isOpen ? "Menü Schließen" : "Menü Öffnen");
  }

  async function loadMovieBase() {
    try {const response = await fetch('movies.json');if (!response.ok) throw new Error('movies.json konnte nicht geladen werden.');currentData = await response.json();loadTableData(currentData);}
    catch(err) {document.getElementById('inputPlot').innerHTML = '<h3>Fehler</h3><p>' + err.message + '</p>';console.error(err);}
  }

  function loadTableData(data) {
    const movieCounter = data.length;
    const numberCounter = document.getElementById('inputNumber');
    numberCounter.innerHTML = movieCounter + 1;
  }

  let fsk = '0';
  function inputFSK(obj) {
    const fskImage = document.getElementById('inputFSK');
    fsk = String(fskImage.src).split('FSK-')[1].split('.png')[0];
    if (obj === 'minus' && fsk === '0') {fskImage.src = 'icons/FSK-18.png';fsk = '18';}
    else if (obj === 'minus' && fsk === '6') {fskImage.src = 'icons/FSK-0.png';fsk = '0';}
    else if (obj === 'minus' && fsk === '12') {fskImage.src = 'icons/FSK-6.png';fsk = '6';}
    else if (obj === 'minus' && fsk === '16') {fskImage.src = 'icons/FSK-12.png';fsk = '12';}
    else if (obj === 'minus' && fsk === '18') {fskImage.src = 'icons/FSK-16.png';fsk = '16';}
    else if (obj === 'plus' && fsk === '0') {fskImage.src = 'icons/FSK-6.png';fsk = '6';}
    else if (obj === 'plus' && fsk === '6') {fskImage.src = 'icons/FSK-12.png';fsk = '12';}
    else if (obj === 'plus' && fsk === '12') {fskImage.src = 'icons/FSK-16.png';fsk = '16';}
    else if (obj === 'plus' && fsk === '16') {fskImage.src = 'icons/FSK-18.png';fsk = '18';}
    else if (obj === 'plus' && fsk === '18') {fskImage.src = 'icons/FSK-0.png';fsk = '0';}
  }
  function parseFSK() {const fskImage = document.getElementById('inputFSK');fskImage.src = 'icons/FSK-'+fsk+'.png';}

  let inputRuntime = '';let inputRuntimeParsed = '';
  function calcTime(obj) {
    const inputRuntimeHour = document.getElementById('inputRuntimeHour');
    const inputRuntimeMinute = document.getElementById('inputRuntimeMinute');
    let hours = Number(inputRuntimeHour.innerHTML);
    let minutes = Number(inputRuntimeMinute.innerHTML);
    inputRuntime = (hours * 60) + minutes;
    if (obj === 'inputRuntimeParsed') {
      inputRuntime = inputRuntimeParsed;
      let minutes = inputRuntimeParsed;
      let hours = Math.floor(minutes / 60);
      inputRuntimeHour.innerHTML = hours;
      let leftMinutes = parseFloat(minutes % 60);
      inputRuntimeMinute.innerHTML = String(leftMinutes).padStart(2, '0');
    }
  }
  function setMinute(obj) {obj.innerHTML = String(obj.innerHTML).padStart(2, '0');}

  document.querySelectorAll('div[contenteditable="true"]').forEach(td => {
    td.addEventListener('paste', function(e) {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  });

  function resetAll() {window.location.reload();}

  function nextMovie() {
    const numberCounter = document.getElementById('inputNumber');
    numberCounter.innerHTML = Number(numberCounter.innerHTML) + 1;
    document.getElementById('inputTitle').innerHTML = '';
    loadPreviewIcon();
    document.getElementById('inputYear').innerHTML = '';
    document.getElementById('inputFSK').src = 'icons/FSK-0.png';
    document.getElementById('inputRuntimeHour').innerHTML = '';
    document.getElementById('inputRuntimeMinute').innerHTML = '';
    document.getElementById('inputPlot').innerHTML = '';
  }
  
  let saveContent = '';
  function saveMovie() {
    let title = document.getElementById('inputTitle').innerHTML;
    let number = document.getElementById('inputNumber').innerHTML;
    number = String(number).padStart(4, '0');
    let year = document.getElementById('inputYear').innerHTML;
    let plot = document.getElementById('inputPlot').innerHTML;
    
    saveContent = 
    '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>\n'+
    '<movie>\n'+
    '    <title>'+title+'</title>\n'+
    '    <originaltitle>'+title+'</originaltitle>\n'+
    '    <plot>'+plot+'</plot>\n'+
    '    <runtime>'+inputRuntime+'</runtime>\n'+
    '    <mpaa>FSK-'+fsk+'</mpaa>\n'+
    '    <id>'+number+'</id>\n'+
    '    <uniqueid type="mbdb">'+number+'</uniqueid>\n'+
    '    <year>'+year+'</year>\n'+
    '</movie>\n';
    console.log(saveContent);
  }

  function downloadNFO() {
    saveMovie();
    let title = document.getElementById('inputTitle').innerHTML;
    title = title.replace(/&amp;/gi, '&');
    const blob = new Blob([saveContent], { type: "application/xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = title + '.nfo';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  const templateBG = document.getElementById('templateBG');
  let uploadedImage = null;
  const img = new Image();
	const reader = new FileReader();

  function loadPreviewIcon() {
		const canvas = document.getElementById('inputPoster');
		const ctx = canvas.getContext('2d');
		canvas.width = 600;canvas.height = 900;
		ctx.drawImage(templateBG, 0, 0, 600, 900);
	}
  function uploadIcon(obj) {
		const file = obj.files[0];
		if (!file) {return;}
		if (file.type === 'image/jpeg' || file.type === 'image/png' || file.type === 'image/webp') {importIcon(file);}
	}
	function importIcon(file) {
		const reader = new FileReader();
		reader.addEventListener('load', () => {
			const img = new Image();
			img.addEventListener('load', () => {uploadedImage = img;drawIcon();});
			img.src = reader.result;
		});
		reader.readAsDataURL(file);
	}
	function drawIcon() {
		const canvas = document.getElementById('inputPoster');
		const ctx = canvas.getContext('2d');
		canvas.width = 600;canvas.height = 900;
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		if (uploadedImage) {ctx.drawImage(uploadedImage, 0, 0, 600, 900);}
	}
  async function downloadCover(obj) {
    let title = document.getElementById('inputTitle').innerHTML;
    title = title.replace(/&amp;/gi, '&');
    const canvas = document.getElementById(obj);
    canvas.toBlob(function(blob) {
      if (!blob) {alert('Das JPG konnte nicht erstellt werden.');return;}
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = title + '-poster.jpg';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 1.0);
  }

  function clickElement(obj) {document.getElementById(obj).click();}

  function uploadNFO(obj) {
    file = obj.files[0];
    var content = document.getElementById('loadedContent');
    var reader = new FileReader();
    reader.addEventListener('load',() => {content.innerHTML = reader.result;parseNFO();},false,);
    reader.readAsText(file);
  }
  
  function parseNFO() {
    var fullContent = document.getElementById('loadedContent').innerHTML;
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(fullContent,'text/xml');
    if (xmlDoc.getElementsByTagName('movie')[0] != undefined) {
      document.getElementById('inputTitle').innerHTML = xmlDoc.getElementsByTagName('title')[0].childNodes[0].nodeValue;
      document.getElementById('inputNumber').innerHTML = String(parseInt(xmlDoc.getElementsByTagName('id')[0].childNodes[0].nodeValue)).padStart(4, '0');
      inputRuntimeParsed = xmlDoc.getElementsByTagName('runtime')[0].childNodes[0].nodeValue;calcTime('inputRuntimeParsed');
      document.getElementById('inputYear').innerHTML = xmlDoc.getElementsByTagName('year')[0].childNodes[0].nodeValue;
      fsk = xmlDoc.getElementsByTagName('mpaa')[0].childNodes[0].nodeValue.slice(4);parseFSK();
      document.getElementById('inputPlot').innerHTML = xmlDoc.getElementsByTagName('plot')[0].childNodes[0].nodeValue;
      document.documentElement.scrollTop = 0;
    }
    else {alert('Diese .nfo-Datei enthält keine Filmdaten!');}
  }
</script>
