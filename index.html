<!DOCTYPE html>
<html>
    <head>
    <title>MB Series-Base</title>
    <meta charset="utf-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"></meta>
    <link rel="icon" type="image/x-icon" href="../homepage/images/MB_Icon_02.svg"></link>
    <style>
      body {width: 100vw;height: 100vh;display: grid;grid-template-columns: min-content auto;grid-template-rows: 100vh;background-color: #000000;margin: 0;padding: 0;overflow: hidden;color: #dbdbdb;font-size: 1rem;font-family: Arial, Helvetica, sans-serif;-webkit-tap-highlight-color: transparent;}
      body {background: radial-gradient(circle at 80% 10%,#111111, transparent 40%), radial-gradient(circle at 30% 90%, #111111, transparent 30%), linear-gradient(50deg,#000000,#111111 55%,#000000);}

      .sidebar {grid-column: 1;grid-row: 1;display: grid;grid-template-columns: min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content;border-right: 0.01rem solid #999999;overflow-y: auto;}
      .sidebar {background: radial-gradient(circle at 80% 10%,#111111, transparent 40%), radial-gradient(circle at 30% 90%, #111111, transparent 30%), linear-gradient(50deg,#000000,#111111 55%,#000000);}
      .sidebar a {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;}
      .sidebar a svg {margin: 0 0.5rem 0 0;}
      .sidebarSpacer {height: 3rem;}
      .sidebarToggle {display: none;}
      .sidebarButton {background: linear-gradient(125deg, #222222, #444444);border-radius: 1rem;border: 0.01rem solid #444444;outline: none;text-decoration: none;color: #999999;white-space: pre;cursor: pointer;transition: all 0.6s;}
      .sidebarButton:hover, .sidebarButton:active, .sidebarButton:focus {background: linear-gradient(125deg, #132b13, #081a04);border-color: #0f9b03;color: #dbdbdb;}
      .sidebarButtonActive {background: linear-gradient(125deg, #111111, #222222);border-radius: 1rem;border: 0.01rem solid #00bb66;text-decoration: none;color: #00bb66;white-space: pre;cursor: default;transition: all 0.6s;}
      .sidebarButtonNoClick {background: linear-gradient(125deg, #222222, #444444);border-radius: 1rem;border: 0.01rem solid #444444;text-decoration: none;color: #999999;white-space: pre;cursor: default;transition: all 0.6s;}

      .sortHeader {height: 3rem;display: flex;align-items: center;justify-content: center;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;color: #999999;white-space: pre;cursor: default;}
      .sortButton {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;}
      .sortButtonArrow {margin: 0 0.5rem 0 0;}
      .sortButtonArrow:hover {color: #00aaaa;}
      .sortButtonText {margin: 0;}

      .sortOverlay {display: none;grid-column: 2;grid-row: 1;inset: 0;z-index: 9100;background-color: #000000cc;align-items: center;justify-content: center;padding: 10rem;box-sizing: border-box;}
      .sortOverlayContent {padding: 1rem;background: radial-gradient(circle at 80% 10%,#111111, transparent 40%), radial-gradient(circle at 30% 90%, #111111, transparent 30%), linear-gradient(50deg,#000000,#111111 55%,#000000);border: 0.01rem solid #444444;border-radius: 1rem;box-shadow: rgba(0, 0, 0, 0.8) 0 0 2rem;display: flex;flex-wrap: wrap;justify-content: center;gap: 0.5rem;overflow-y: auto;}
      .sortOverlayTitle {width: 100%;text-align: center;font-size: 1.2rem;margin-bottom: 1rem;color: #999999;}
      .sortOverlayOptionButton {min-width: 1rem;height: 3rem;display: flex;align-items: center;justify-content: center;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem;}
      
      .randomButton {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;}
      .randomButton svg {margin: 0 0.5rem 0 0;}

      .searchContainer {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;}
      .searchContainerInput {width: 100%;height: 100%;margin: 0;padding: 0 1rem;background: none;border-radius: 1rem;border: none;outline: none;font-size: 1rem;color: #dbdbdb;cursor: text;}
      .searchContainerInput:focus {outline: none;}
      .searchContainerInput::-webkit-search-cancel-button {filter: invert(50%) brightness(150%);cursor: pointer;}

      .main {grid-column: 2;grid-row: 1;overflow-y: auto;position: relative;}
      .output {display: grid;grid-template-columns: auto;grid-template-rows: auto;overflow-y: scroll;}
      
      .groupLayout {display: none;}
      .groupLayout.show {display: block;}

      .cardContainer {display: grid;grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));gap: 1rem;margin: 1rem;}
      .movieCard {color: #dbdbdb;width: auto;height: auto;display: grid;grid-template-columns: auto auto;grid-template-rows: min-content auto min-content;background-color: #222222;border-radius: 1rem;border: 0.01rem solid #444444;color: #999999;position: relative;top: 0;margin: 0;cursor: pointer;transition: all 0.6s;}
      .movieCard:hover {border-color: #999999;top: -0.5rem;}
      .movieCard:hover .movieTitle {color: #999999;}
      .movieCard:hover .movieNumber {color: #999999;}
      .movieCard:hover .movieNumber svg {color: #999999;}
      .movieCard:hover .movieYear {color: #999999;}
      .movieCard:hover .movieYear svg {color: #999999;}
      .movieCard:hover .movieOverlay1 {box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;}
      .movieCard:hover .movieOverlay2 {opacity: 0;}
      .moviePoster {grid-column: 1 / span 2;grid-row: 1;width: calc(100%);height: auto;aspect-ratio: 2/3;display: flex;justify-content: center;align-items: center;border-top-left-radius: 1rem;border-top-right-radius: 1rem;}
      .moviePoster img {width: 100%;height: auto;object-fit: contain;border-top-left-radius: 1rem;border-top-right-radius: 1rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);}
      .moviePosterOverlay {grid-column: 1 / span 2;grid-row: 2;height: 1rem;position: relative;top: -1rem;background: linear-gradient(180deg, #22222200, #22222222, #22222244, #22222299, #222222ff);}
      .movieTitle {grid-column: 1 / span 2;grid-row: 2;font-size: 0.7rem;margin: 0.5rem 0.5rem 0 0.5rem;line-height: 1rem;display: flex;align-items: center;justify-content: center;text-align: center;color: #dbdbdb;transition: all 0.6s;}
      .movieNumber {grid-column: 1;grid-row: 3;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;color: #dbdbdb;transition: all 0.6s;}
      .movieNumber svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;color: #dbdbdb;transition: all 0.6s;}
      .movieYear {grid-column: 2;grid-row: 3;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;color: #dbdbdb;transition: all 0.6s;}
      .movieYear svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;color: #dbdbdb;transition: all 0.6s;}
      .movieOverlay1 {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 1rem;box-shadow: rgba(255, 255, 255, 0.3) 2px 2px 6px 1px inset;transition: all 0.8s;}
      .movieOverlay2 {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 1rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);transition: all 0.8s;}
      
      
      .movieOverlay {height: 100vh;grid-column: 2;grid-row: 1;inset: 0;padding: 1rem;background-color: #000000bb;z-index: 9099;display: flex;align-items: center;justify-content: center;box-sizing: border-box;}
      .movieOverlayContent {z-index: 9100;inset: 0;margin: auto;background-color: #000000bb;border: 0.01rem solid #444444;border-radius: 1rem;display: grid;grid-template-columns: min-content min-content min-content min-content 0rem min-content min-content min-content;grid-template-rows: min-content auto min-content;}

      .overlayFSK {width: 3rem;height: 3rem;grid-column: 1;grid-row: 1;margin: 1rem 0 0 1rem;} .overlayFSK img {width: 100%;height: 100%;}
      .overlayNumber {height: 3rem;grid-column: 2;grid-row: 1;margin: 1rem 0 0 1rem;padding: 0 1rem 0 0.5rem;display: flex;align-items: center;justify-content: left;}
      .overlayNumber svg {margin: 0 0.5rem 0 0;}
      .overlayYear {height: 3rem;grid-column: 3;grid-row: 1;margin: 1rem 0 0 1rem;padding: 0 1rem 0 0.5rem;display: flex;align-items: center;justify-content: left;}
      .overlayYear svg {margin: 0 0.5rem 0 0;}
      .overlaySeasons {height: 3rem;grid-column: 4;grid-row: 1;margin: 1rem 0 0 1rem;padding: 0 1rem 0 0.5rem;display: flex;align-items: center;justify-content: left;}
      .overlaySeasons svg {margin: 0 0.5rem 0 0;}
      .spacer1 {grid-column: 5;grid-row: 1;}
      .movieOverlayDownloadImage {height: 3rem;grid-column: 6;grid-row: 1;margin: 1rem 0 0 1rem;padding: 0 1rem 0 0.5rem;display: flex;align-items: center;justify-content: left;}
      .movieOverlayDownloadImage svg {margin: 0 0.5rem 0 0;}
      .movieOverlayDownloadNFO {height: 3rem;grid-column: 7;grid-row: 1;margin: 1rem 0 0 1rem;padding: 0 1rem 0 0.5rem;display: flex;align-items: center;justify-content: left;}
      .movieOverlayDownloadNFO svg {margin: 0 0.5rem 0 0;}
      .movieOverlayExitButton {width: 3rem;height: 3rem;grid-column: 8;grid-row: 1;padding: 0;margin: 1rem 1rem 0 1rem;display: flex;align-items: center;justify-content: center;}

      .movieOverlayTitle {grid-column: 1 / span 5;grid-row: 2;margin: 1rem;padding: 0.5rem;font-size: 2rem;display: flex;align-items: center;justify-content: center;font-style: oblique;font-weight: bolder;text-align: center;line-height: normal;}
      .movieOverlayPoster {grid-column: 6 / span 3;grid-row: 2 / span 2;margin: 1rem;padding: 0;}
      .movieOverlayPoster img {width: 100%;height: auto;border-radius: 1rem;}
      .movieOverlayPlot {min-height: 3rem;grid-column: 1 / span 5;grid-row: 3;margin: 1rem 0 1.1rem 1rem;padding: 0;display: flex;align-items: last baseline;justify-content: center;text-align: justify;}
      
      @media (max-width: 600px) {
        body {grid-template-columns: 1fr;}
        .main {grid-column: 1;}
        .sidebar {position: fixed;top: 0;left: 0;height: 100vh;max-width: 60vw;z-index: 2000;transform: translateX(-100%);transition: transform 0.6s ease;background-color: #000000ee;box-shadow: 0 0 1rem #00000099;}
        .sidebar.open {transform: translateX(0);}
        .sidebarToggle {display: flex;position: fixed;top: 0.5rem;right: 0.5rem;z-index: 1001;width: 3rem;height: 3rem;align-items: center;justify-content: center;color: #dbdbdb;background-color: #000000cc;border: 0.01rem solid #999999;border-radius: 1rem;font-size: 1.5rem;cursor: pointer;}

        .sortOverlay {grid-column: 1;grid-row: 1;padding: 0.5rem;}
        .cardContainer {grid-template-columns: repeat(auto-fill, minmax(40vw, 1fr));gap: 1rem;margin: 0.5rem;}
        .cardContainer.open {width: calc(50vw - 1rem); margin: 0.5rem 0.5rem 0 calc(50vw + 0.5rem);}
        #groupContainerZufall .cardContainer {width: calc(50vw - 1rem); margin: 4rem 0.5rem 0 calc(50vw + 0.5rem);}

        .movieOverlay {width: 100vw;grid-column: 1;padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .movieOverlayContent {margin: 0;grid-template-columns: min-content auto min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content;}

        .overlayFSK {grid-column: 1;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
        .spacer1 {grid-column: 2;grid-row: 1;height: 3rem;}
        .movieOverlayExitButton {grid-column: 3;grid-row: 1;margin: 0.5rem 0.5rem 0 0;}
        .movieOverlayTitle {grid-column: 1 / span 3;grid-row: 2;}
        .movieOverlayPoster {grid-column: 2 / span 2;grid-row: 3 / span 5;margin: 0.5rem;} 
        .overlayNumber {grid-column: 1;grid-row: 3;margin: 0.5rem 0 0 0.5rem;}
        .overlayYear {grid-column: 1;grid-row: 4;margin: 0.5rem 0 0 0.5rem;}
        .overlaySeasons {grid-column: 1;grid-row: 5;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadImage {grid-column: 1;grid-row: 6;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadNFO {grid-column: 1;grid-row: 7;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayPlot {grid-column: 1 / span 3;grid-row: 8;margin: 0.5rem;}
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .sortOverlay {padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .cardContainer {grid-template-columns: repeat(auto-fill, minmax(20vw, 1fr));gap: 1rem;margin: 0.5rem;}

        .movieOverlay {grid-column: 2;padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .movieOverlayContent {margin: 0;grid-template-columns: auto auto min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content;}
        .overlayFSK {grid-column: 1;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
        .spacer1 {grid-column: 2;grid-row: 1;height: 3rem;}
        .movieOverlayExitButton {grid-column: 3;grid-row: 1;margin: 0.5rem 0.5rem 0 0;}
        .movieOverlayTitle {grid-column: 1 / span 3;grid-row: 2;}
        .movieOverlayPoster {grid-column: 2 / span 2;grid-row: 3 / span 5;margin: 0.5rem;} 
        .overlayNumber {grid-column: 1;grid-row: 3;margin: 0.5rem 0 0 0.5rem;}
        .overlayYear {grid-column: 1;grid-row: 4;margin: 0.5rem 0 0 0.5rem;}
        .overlaySeasons {grid-column: 1;grid-row: 5;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadImage {grid-column: 1;grid-row: 6;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadNFO {grid-column: 1;grid-row: 7;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayPlot {grid-column: 1 / span 3;grid-row: 8;margin: 0.5rem;}
      }
  </style>
  </head>

  function sortGroup(z) {
    const sameGroup = currentGroup === z;
    if (sameGroup) {currentData.reverse();currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';}
    else {currentGroup = z;currentSortDirection = 'asc';currentData.sort((a, b) => {
      if (z === 'Nummer') {const numA = parseInt(a[Object.keys(a)[0]]) || 0;const numB = parseInt(b[Object.keys(b)[0]]) || 0;return numA - numB;}
      else {const nameA = String(a[Object.keys(a)[1]] ?? '');const nameB = String(b[Object.keys(b)[1]] ?? '');return nameA.localeCompare(nameB, 'de');}
    });}
    loadTableData(currentData, z);setGroupActive();
  }

  function sortOverlayDirection(obj) {event.stopPropagation();currentData.reverse();currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';loadTableData(currentData, obj);setGroupActive();}

  function loadTableData(data, groupName = null) {
    main.innerHTML = '';
    const groups = {'Nummer': [], 'Name': [], 'Zufall': [], '0-9': [], ...Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => [c, []]))};
    for (const entry of data) {
      const name = entry.title ?? '';
      const letter1 = name.charAt(0).toUpperCase();
      groups['Name'].push(entry);
      groups['Zufall'].push(entry);
      groups['Nummer'].push(entry);
      if (/[0-9]/.test(letter1)) {groups['0-9'].push(entry);}
      else if (groups[letter1]) {groups[letter1].push(entry);}
    }
    for (const groupContainer in groups) {
      const groupLayout = document.createElement('div');
      groupLayout.id = 'groupContainer' + groupContainer;
      groupLayout.className = 'groupLayout';
      if (groupContainer === (groupName || 'Name')) {groupLayout.classList.add('show');}
      let data = groups[groupContainer];
      if (groupContainer === 'Nummer') {data.sort((a, b) => {const numA = parseInt(a.id) || 0;const numB = parseInt(b.id) || 0;return currentSortDirection === 'asc' ? numA - numB : numB - numA;});}
      else if (groupContainer !== 'Zufall') {data.sort((a, b) => {const nameA = a.title ?? '';const nameB = b.title ?? '';return currentSortDirection === 'asc' ? nameA.localeCompare(nameB, 'de') : nameB.localeCompare(nameA, 'de');});}
      if (data.length > 0) {const table = generateTableData(data);groupLayout.appendChild(table);}
      else {groupLayout.innerHTML = '<p>Keine Einträge gefunden...</p>';}
      main.appendChild(groupLayout);
    }
  }

  function setGroupActive() {
    const sortButtonArrow = document.querySelector('.sortButtonArrow');
    const sortButtonText = document.getElementById('sortButtonText');
    const arrowDown = '<svg width="2rem" height="2rem" viewBox="0 -1000 960 960" fill="currentColor"><path d="M465-363.5q-7-2.5-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5q-8 0-15-2.5Z"/></svg>';
    const arrowUp = '<svg width="2rem" height="2rem" viewBox="0 -960 960 960" fill="currentColor" style="transform: rotate(180deg);"><path d="M465-363.5q-7-2.5-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5q-8 0-15-2.5Z"/></svg>';
    if (!sortButtonText || !sortButtonArrow) return;sortButtonText.textContent = currentGroup;
    if (currentGroup === 'Zufall') {sortButtonArrow.innerHTML = '';}
    else {sortButtonArrow.innerHTML = currentSortDirection === 'asc' ? arrowDown : arrowUp;}
  }

  function generateTableData(data) {
    const cardContainer = document.createElement('div');
    cardContainer.className = 'cardContainer';
    data.forEach(row => {
      const card = document.createElement('div');
      card.className = 'movieCard';
      card.dataset.title = (row.title ?? '').toLowerCase();

      const moviePoster = document.createElement('div');
      moviePoster.className = 'moviePoster';
      moviePoster.innerHTML = '<img src="' + row.poster + '" loading="lazy">';

      const moviePosterOverlay = document.createElement('div');
      moviePosterOverlay.className = 'moviePosterOverlay';
      
      const movieNumber = document.createElement('div');
      movieNumber.className = 'movieNumber';
      movieNumber.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m240-160 40-160H120l20-80h160l40-160H180l20-80h160l40-160h80l-40 160h160l40-160h80l-40 160h160l-20 80H660l-40 160h160l-20 80H600l-40 160h-80l40-160H360l-40 160h-80Zm140-240h160l40-160H420l-40 160Z"/></svg>' + row.id ?? "";
      
      const movieYear = document.createElement('div');
      movieYear.className = 'movieYear';
      movieYear.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>' + row.year ?? "";

      const movieTitle = document.createElement('div');
      movieTitle.className = 'movieTitle';
      movieTitle.innerHTML = row.title;
      
      const movieOverlay1 = document.createElement('div');
      movieOverlay1.className = 'movieOverlay1';
      movieOverlay1.onclick = () => createOverlay(row);

      const movieOverlay2 = document.createElement('div');
      movieOverlay2.className = 'movieOverlay2';
      movieOverlay2.onclick = () => createOverlay(row);
      
      card.appendChild(moviePoster);
      card.appendChild(moviePosterOverlay);
      card.appendChild(movieNumber);
      card.appendChild(movieYear);
      card.appendChild(movieTitle);
      card.appendChild(movieOverlay1);
      card.appendChild(movieOverlay2);
      
      cardContainer.appendChild(card);
    });
    return cardContainer;
  }

  function searchTableData(searchIndex) {
    const groupDiv = document.getElementById('groupContainer' + currentGroup);
    if (!groupDiv) return;
    const cards = groupDiv.querySelectorAll('.movieCard');
    const search = searchIndex.trim().toLowerCase();
    cards.forEach(card => {
      const title = card.dataset.title;
      card.style.display = (search === '' || title.includes(search)) ? '' : 'none';
    });
  }

  function createOverlay(movie) {
    const movieOverlay = document.createElement('div');
    const movieOverlayContent = document.createElement('div');
    const overlayFSK = document.createElement('div');
    const overlayNumber = document.createElement('div');
    const overlayYear = document.createElement('div');
    const overlaySeasons = document.createElement('div');
    const movieOverlayDownloadImage = document.createElement('div');
    const movieOverlayDownloadNFO = document.createElement('div');
    const movieOverlayExitButton = document.createElement('div');
    const movieOverlayTitle = document.createElement('div');
    const movieOverlayPlot = document.createElement('div');
    const movieOverlayPoster = document.createElement('div');
    
    movieOverlay.className = 'movieOverlay';
    movieOverlay.onclick = (event) => {if (event.target === movieOverlay) {removeOverlay();}};
      movieOverlayContent.className = 'movieOverlayContent';
        overlayFSK.className = 'overlayFSK';
        overlayFSK.innerHTML = '<img src="icons/' + movie.mpaa + '.png" loading="lazy">';
        movieOverlayContent.appendChild(overlayFSK);
        overlayNumber.className = 'overlayNumber sidebarButtonNoClick';
        overlayNumber.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m240-160 40-160H120l20-80h160l40-160H180l20-80h160l40-160h80l-40 160h160l40-160h80l-40 160h160l-20 80H660l-40 160h160l-20 80H600l-40 160h-80l40-160H360l-40 160h-80Zm140-240h160l40-160H420l-40 160Z"/></svg>' + movie.id;
        movieOverlayContent.appendChild(overlayNumber);
        overlayYear.className = 'overlayYear sidebarButtonNoClick';
        overlayYear.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>' + movie.year;
        movieOverlayContent.appendChild(overlayYear);
        overlaySeasons.className = 'overlaySeasons sidebarButtonNoClick';
        let staffeln = '';if (movie.seasons <= 1) {staffeln = ' Staffel';} else {staffeln = ' Staffeln';}
        overlaySeasons.innerHTML = '<svg width="24px" height="24px" viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l1.82 3.64c.08.16-.04.36-.22.36h-1.98c-.38 0-.73-.21-.89-.55L15 4h-2l1.82 3.64c.08.16-.04.36-.22.36h-1.98c-.38 0-.73-.21-.89-.55L10 4H8l1.82 3.64c.08.16-.04.36-.22.36H7.62c-.38 0-.73-.21-.9-.55L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-.55-.45-1-1-1h-3z"/></svg>' + movie.seasons + staffeln;
        movieOverlayContent.appendChild(overlaySeasons);
        const spacer1 = document.createElement('div');
        spacer1.className = 'spacer1';
        movieOverlayContent.appendChild(spacer1);
        movieOverlayDownloadImage.className = 'movieOverlayDownloadImage sidebarButton';
        movieOverlayDownloadImage.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg> Cover';
        movieOverlayDownloadImage.onclick = () => downloadImage(movie);
        movieOverlayContent.appendChild(movieOverlayDownloadImage);
        movieOverlayDownloadNFO.className = 'movieOverlayDownloadNFO sidebarButton';
        movieOverlayDownloadNFO.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg> Info-File';
        movieOverlayDownloadNFO.onclick = () => downloadNFO(movie);
        movieOverlayContent.appendChild(movieOverlayDownloadNFO);
        movieOverlayExitButton.className = 'movieOverlayExitButton sidebarButton';
        movieOverlayExitButton.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>';
        movieOverlayExitButton.onclick = () => removeOverlay();
        movieOverlayContent.appendChild(movieOverlayExitButton);

        movieOverlayTitle.className = 'movieOverlayTitle';
        movieOverlayTitle.innerHTML = movie.title;
        movieOverlayContent.appendChild(movieOverlayTitle);

        movieOverlayPlot.className = 'movieOverlayPlot';
        movieOverlayPlot.innerHTML = movie.plot;
        movieOverlayContent.appendChild(movieOverlayPlot);
        movieOverlayPoster.className = 'movieOverlayPoster';
        movieOverlayPoster.innerHTML = '<img src="' + movie.poster + '" loading="lazy">';
        movieOverlayContent.appendChild(movieOverlayPoster);
      movieOverlay.appendChild(movieOverlayContent);
    main.style = 'overflow: hidden;'
    document.body.appendChild(movieOverlay);
  }
  function removeOverlay() {document.querySelector('.movieOverlay')?.remove();document.querySelector('.movieOverlayContent')?.remove();main.style = 'overflow: scroll;';}

  function downloadImage(movie) {downloadFile(movie.poster, `${movie.filename}-poster.jpg`);}
  function downloadNFO(movie) {downloadFile(`Movies/${movie.folder}/${movie.filename}.nfo`, `${movie.filename}.nfo`);}
  function downloadFile(url, filename) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
